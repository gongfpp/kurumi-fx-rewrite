</style><link rel="stylesheet" href="./preview-capture.css?v=ebe513d153a1219d73a65051f32fb508afce547c-capture-v1-1fbef814f493"></head><body><main><h1>手动原声与浮盈反应</h1><small>固定虚构样例 · 不读取或写入游戏存档 · 不提交任何成绩</small><p id="version"></p><div class="buttons" id="scenarios"><button data-case="base">普通持仓</button><button data-case="spike">空单突增浮盈</button><button data-case="loss">浮盈骤转亏</button><button data-case="flicker">快速翻红绿</button><button data-case="hedge">双向对冲遇插针</button><button data-case="borrow">只有借款到账</button><button data-case="flat">空仓遇插针</button><button data-case="no-match">亏损无匹配台词</button></div><section class="view"><div><strong id="mood"></strong><img id="portrait" alt="久留美表情"></div><div><p id="metrics"></p><p id="speech"></p><p id="caption"></p><div class="buttons"><button id="play">播放当前原声</button><button id="catalog">原声目录</button></div><p id="status" role="status"></p><small>切换场景不会播放。播放后再点击一次即停止。切换标签页后也不会自动续播。</small></div></section><section id="capture-panel"></section><details open><summary>本轮实际播放记录</summary><p id="play-count"></p><div id="trace"></div></details><dialog id="library"><p><button id="capture-stop-library" type="button" disabled>停止录制</button> <small>先在主页面开始录制；关目录后可下载。</small></p><button id="close-library">关闭目录</button><div id="voice-list"></div></dialog></main><script type="module" src="./voice-review.js?v=ebe513d153a1219d73a65051f32fb508afce547c-capture-v1-1fbef814f493"></script></body></html>
